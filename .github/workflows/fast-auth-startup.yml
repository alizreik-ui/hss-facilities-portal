name: Remove blocking connecting screen
on:
  push:
    paths:
      - '.github/workflows/fast-auth-startup.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove startup blocker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/page.tsx')
          text=p.read_text()
          old="[page,setPage]=useState('dashboard'),[lang,setLang]=useState<'en'|'ar'>('en'),[loading,setLoading]=useState(true);"
          new="[page,setPage]=useState('dashboard'),[lang,setLang]=useState<'en'|'ar'>('en'),[loading,setLoading]=useState(false);"
          if old not in text:
              raise SystemExit('loading initializer not found')
          text=text.replace(old,new,1)
          p.write_text(text)
          PY
      - name: Commit
        run: |
          git config user.name hss-portal-bot
          git config user.email actions@users.noreply.github.com
          git add app/page.tsx
          git commit -m 'Remove blocking connecting screen'
          git push
