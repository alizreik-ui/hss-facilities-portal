name: Full portal dashboard redesign v2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/full-dashboard-redesign-v2.yml'
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Work Orders and PPM tabs and redesign dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/portal/page.tsx')
          s=p.read_text()
          # Remove navigation tabs only (leave underlying code/data untouched for compatibility)
          s=s.replace("{manager&&<button onClick={()=>go('workorders')}>▤ {t('Work Orders','أوامر العمل')}</button>}","")
          s=s.replace("{manager&&<button onClick={()=>go('ppm')}>↻ {t('PPM Schedules','جداول الصيانة الوقائية')}</button>}","")
          # Remove Work Order and PPM KPI cards from dashboard
          s=s.replace("<Kpi title={t('Open Work Orders','أوامر العمل المفتوحة')} value={num(dashboard.woOpen)} sub={`${num(dashboard.woOverdue)} ${t('overdue','متأخرة')}`}/>","")
          s=s.replace("<Kpi title={t('Active PPM','الصيانة الوقائية النشطة')} value={num(dashboard.ppmActive)} sub={t('scheduled maintenance','صيانة مجدولة')}/>","")
          p.write_text(s)

          css=Path('app/globals.css')
          c=css.read_text()
          marker='/* FULL PORTAL DASHBOARD V2 */'
          if marker not in c:
            c += r'''

/* FULL PORTAL DASHBOARD V2 */
.app{min-height:100vh;display:grid;grid-template-columns:270px minmax(0,1fr);background:linear-gradient(135deg,#eef5ff 0%,#f8fafc 45%,#f5f3ff 100%)}
.app>aside{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,#071b3a 0%,#0b2a56 52%,#102b63 100%);padding:24px 16px;color:#fff;box-shadow:12px 0 35px rgba(15,23,42,.12);z-index:30}
.app>aside .logo{font-size:30px;font-weight:900;letter-spacing:1px;padding:2px 12px 18px;color:#fff}.app>aside .logo:after{content:' DIGITAL PORTAL';display:block;font-size:10px;font-weight:700;letter-spacing:1.6px;color:#93c5fd;margin-top:4px}
.app>aside .user{margin:0 6px 18px;padding:14px;border-radius:16px;background:linear-gradient(135deg,rgba(59,130,246,.24),rgba(124,58,237,.22));border:1px solid rgba(255,255,255,.12);display:grid;gap:3px}.app>aside .user b{font-size:14px}.app>aside .user small{color:#bfdbfe}
.app>aside nav{display:grid;gap:6px}.app>aside nav button,.app>aside nav a{appearance:none;text-decoration:none;border:0;width:100%;display:flex;align-items:center;gap:9px;text-align:left;padding:12px 13px;border-radius:12px;color:#dbeafe;background:transparent;font-size:14px;font-weight:650;transition:.18s ease}.app>aside nav button:hover,.app>aside nav a:hover{color:#fff;background:linear-gradient(90deg,rgba(37,99,235,.72),rgba(124,58,237,.64));transform:translateX(3px);box-shadow:0 8px 20px rgba(2,6,23,.18)}
.app>aside .bottom{position:sticky;bottom:0;margin-top:20px;padding-top:14px;background:linear-gradient(180deg,transparent,#102b63 26%);display:grid;grid-template-columns:1fr 1fr;gap:8px}.app>aside .bottom button{border:1px solid rgba(255,255,255,.15);border-radius:11px;padding:10px;background:rgba(255,255,255,.08);color:#fff}
.app>main{min-width:0;padding:0 28px 36px}.app>main>header{margin:0 -28px 24px;padding:24px 30px;color:#fff;background:linear-gradient(110deg,#1d4ed8 0%,#4338ca 52%,#6d28d9 100%);box-shadow:0 12px 30px rgba(67,56,202,.16);position:sticky;top:0;z-index:15}.app>main>header h1{font-size:28px;margin:0 0 5px;color:#fff;letter-spacing:-.4px}.app>main>header span{color:#dbeafe;font-size:13px}
.app>main>section{max-width:1500px;margin:0 auto}.app .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}.app .cards .kpi{border:0;border-radius:18px;min-height:132px;padding:19px;color:#fff;box-shadow:0 14px 30px rgba(15,23,42,.10);position:relative;overflow:hidden;transition:.2s ease;background:linear-gradient(135deg,#2563eb,#3b82f6)}.app .cards .kpi:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(15,23,42,.15)}.app .cards .kpi:before{content:'';position:absolute;width:120px;height:120px;right:-38px;top:-42px;border-radius:999px;background:rgba(255,255,255,.13)}.app .cards .kpi:nth-child(2){background:linear-gradient(135deg,#0f766e,#14b8a6)}.app .cards .kpi:nth-child(3){background:linear-gradient(135deg,#16a34a,#4ade80)}.app .cards .kpi:nth-child(4){background:linear-gradient(135deg,#7c3aed,#a855f7)}.app .cards .kpi span{display:block;font-size:13px;opacity:.94}.app .cards .kpi strong{display:block;font-size:38px;line-height:1.05;margin:14px 0 8px;font-weight:900;position:relative}.app .cards .kpi small{font-size:12px;opacity:.9;position:relative}
.app .panel{background:rgba(255,255,255,.96);border:1px solid #e5e7eb;border-radius:20px;padding:22px;box-shadow:0 10px 28px rgba(15,23,42,.06);margin-bottom:18px}.app .panel h2{margin:0 0 18px;font-size:20px;color:#172033}.app .panel h3{margin-top:22px;color:#263248}
.app .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.app .wide{grid-column:1/-1}.app label{font-size:12px;font-weight:700;color:#64748b}.app input,.app select,.app textarea{margin-top:6px;background:#fff;border:1px solid #dbe3ec;border-radius:12px;padding:12px 13px}.app input:focus,.app select:focus,.app textarea:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(59,130,246,.11)}
.app .primary,.app .actions button{border:0;border-radius:11px;padding:11px 15px;background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;font-weight:700;box-shadow:0 8px 18px rgba(37,99,235,.18)}.app .primary:hover,.app .actions button:hover{transform:translateY(-1px)}
.app .tablewrap{overflow:auto;border:1px solid #e5e7eb;border-radius:14px}.app table{min-width:720px;background:#fff}.app th{background:linear-gradient(180deg,#f8fafc,#eef2f7);color:#475569;position:sticky;top:0}.app th,.app td{padding:13px 14px}.app tbody tr{transition:.15s}.app tbody tr:hover{background:#eff6ff}.app .actionrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eef2f7}
html[dir=rtl] .app>aside nav button,html[dir=rtl] .app>aside nav a{text-align:right}html[dir=rtl] .app>aside nav button:hover,html[dir=rtl] .app>aside nav a:hover{transform:translateX(-3px)}
@media(max-width:1180px){.app{grid-template-columns:230px minmax(0,1fr)}.app .cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:820px){.app{display:block}.app>aside{position:relative;height:auto;padding:14px}.app>aside .logo,.app>aside .user{display:none}.app>aside nav{display:flex;overflow-x:auto;gap:8px;padding-bottom:4px;scrollbar-width:none}.app>aside nav::-webkit-scrollbar{display:none}.app>aside nav button,.app>aside nav a{width:auto;white-space:nowrap;flex:0 0 auto;background:rgba(255,255,255,.08);padding:10px 12px}.app>aside .bottom{position:static;display:flex;justify-content:flex-end;background:transparent;margin-top:8px;padding-top:4px}.app>aside .bottom button{width:auto}.app>main{padding:0 16px 28px}.app>main>header{position:relative;margin:0 -16px 18px;padding:20px}.app>main>header h1{font-size:23px}.app .grid{grid-template-columns:1fr}.app .wide{grid-column:auto}}
@media(max-width:560px){.app .cards{grid-template-columns:1fr}.app .cards .kpi{min-height:118px}.app .panel{padding:16px;border-radius:16px}.app>main{padding-left:12px;padding-right:12px}.app>main>header{margin-left:-12px;margin-right:-12px}.app .actionrow{grid-template-columns:1fr}.app table{min-width:640px}}
'''
          css.write_text(c)
          PY
      - name: Commit redesign
        run: |
          git config user.name 'hss-portal-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/portal/page.tsx app/globals.css
          git commit -m 'Remove work order PPM tabs and fully restyle portal dashboard' || exit 0
          git push
